services:
  backend:
    build:
      context: ./backend
    container_name: rcei-backend
    ports:
      - "8000:8000"
    environment:
      # Browser may call the API via the frontend proxy; keep local Docker origins allowed
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: rcei-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
